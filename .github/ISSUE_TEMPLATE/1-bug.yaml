name: 🐛 Report a problem
description: Something does not work, or works differently from what the page says.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Every tweak has a diagnostics page that writes a report of what attached on your phone; pasting it answers most questions before they are asked. Please do not post private messages, names or phone numbers.
  - type: dropdown
    id: tweak
    attributes:
      label: Which tweak
      options: [Albrhi for Instagram, Albrhi for YouTube, Albrhi for X, Albrhi for TikTok, Albrhi for YouTube Music, Albrhi Panel, Albrhi NextUp, Albrhi Watch, Other]
    validations:
      required: true
  - type: input
    id: albrhi-version
    attributes:
      label: Albrhi version
      description: The package version in Sileo, or the bottom of the tweak's settings
      placeholder: e.g. 1.113.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: The app's version
      description: The version of the app the tweak patches
      placeholder: e.g. Instagram 410.1.0
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      options:
        - Jailbroken (roothide)
        - Jailbroken (rootless)
        - Jailbroken (rootful)
        - Sideloaded
        - TrollStore
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS
      placeholder: e.g. iPhone 14, iOS 16.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Screenshots and videos help.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The diagnostics report
      description: From the tweak's diagnostics page, if it has one
      render: text
