name: ✨ Suggest a feature
description: An idea for something a tweak could do.
title: 'feat: '
labels:
  - enhancement
body:
  - type: dropdown
    id: tweak
    attributes:
      label: Which tweak
      options: [Albrhi for Instagram, Albrhi for YouTube, Albrhi for X, Albrhi for TikTok, Albrhi for YouTube Music, Albrhi NextUp, Albrhi Watch, A new app]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is missing
      description: A clear description of the problem or the missing feature
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How you would like it to work
    validations:
      required: true
  - type: checkboxes
    id: before
    attributes:
      label: Before sending
      options:
        - label: I looked for this feature in the settings and in the existing issues.
          required: true
