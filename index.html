<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albrhi</title>
<link rel="icon" href="CydiaIcon.png">
<meta name="description" content="Tweaks by Ibrahim Ismail AL-Rahn: Instagram, YouTube, X, TikTok, WhatsApp and more. Add the source to Sileo or Zebra.">
<style>
  :root {
    --accent: #2AD078;
    --accent-ink: #04210f;
    --bg: #f6f8f7;
    --fg: #0d1a14;
    --muted: #5d6f66;
    --card: #ffffff;
    --line: #dfe8e3;
    --chip: #e9f3ee;
    --glow: rgba(42, 208, 120, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #04100a;
      --fg: #eaf6ef;
      --muted: #8fb3a1;
      --card: #0a1f15;
      --line: #15392a;
      --chip: #10301f;
      --glow: rgba(42, 208, 120, .22);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 18px 72px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image: radial-gradient(900px 420px at 50% -120px, var(--glow), transparent 70%);
    background-repeat: no-repeat;
  }
  main { max-width: 720px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 18px; padding: 52px 0 26px; }
  header img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 14px 34px rgba(11, 110, 61, .38); flex: none; }
  h1 { font-size: 38px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
  .lede { color: var(--muted); font-size: 16px; margin: 4px 0 0; }


  /* the moving rows of cards: every tool, two rows going opposite ways, full width of the screen. Hover or touch pauses; reduced motion stops them and lets the row scroll by hand. */
  .reel { margin: 6px calc(50% - 50vw) 8px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
  .lane { display: flex; gap: 14px; width: max-content; padding: 7px 0; animation: drift 60s linear infinite; }
  .lane.back { animation-direction: reverse; animation-duration: 74s; }
  .reel:hover .lane, .reel:active .lane { animation-play-state: paused; }
  .lane a { display: block; flex: none; width: min(78vw, 400px); border-radius: 16px; overflow: hidden; line-height: 0; box-shadow: 0 10px 26px rgba(0, 0, 0, .28); transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s; }
  .lane a:hover { transform: translateY(-6px) scale(1.035) rotate(-.6deg); box-shadow: 0 20px 40px rgba(0, 0, 0, .4); }
  .lane img { width: 100%; height: auto; display: block; }
  @keyframes drift { to { transform: translateX(calc(-50% - 7px)); } }
  @media (prefers-reduced-motion: reduce) { .reel { overflow-x: auto; -webkit-mask-image: none; mask-image: none; } .lane { animation: none; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin: 0 0 18px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
  .url {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; word-break: break-all;
    background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 14px;
  }
  .btn {
    display: inline-block; font: 600 15px/1 -apple-system, system-ui, sans-serif; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 11px; padding: 12px 17px; margin: 0 6px 6px 0; text-decoration: none; cursor: pointer;
  }
  .btn.secondary { background: var(--chip); color: var(--fg); }
  .steps { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

  .group { margin: 30px 0 0; }
  .group h3 { font-size: 19px; letter-spacing: -0.01em; margin: 0 2px 2px; }
  .group .note { color: var(--muted); font-size: 14px; margin: 0 2px 12px; }
  .pkg { display: flex; gap: 15px; align-items: center; padding: 15px 16px; margin: 0 0 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .pkg img { width: 60px; height: 60px; border-radius: 14px; flex: none; box-shadow: 0 6px 16px rgba(0, 0, 0, .18); }
  .pkg .plain { width: 60px; height: 60px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--muted); background: var(--chip); }
  .pkg-body { min-width: 0; flex: 1; }
  .pkg-name { font-weight: 650; font-size: 17px; line-height: 1.25; }
  .pkg-desc { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 2px; }
  .pkg-meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .chip { background: var(--chip); border-radius: 99px; padding: 2px 9px; font-weight: 600; color: var(--fg); }
  .pkg a.more { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; flex: none; }
  @media (prefers-color-scheme: light) { .pkg a.more { color: #0b8a4a; } }

  footer { color: var(--muted); font-size: 13px; margin-top: 38px; text-align: center; line-height: 1.6; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>

  <header>
    <img src="CydiaIcon.png" alt="">
    <div>
      <h1>Albrhi</h1>
      <p class="lede">Tweaks by Ibrahim Ismail AL-Rahn</p>
    </div>
  </header>

  <div class="reel" aria-label="The tools in this source"><div class="lane" id="lane1"></div></div>
  <div class="reel"><div class="lane back" id="lane2"></div></div>

  <div class="card" style="margin-top:18px">
    <h2>Add this source</h2>
    <span class="url" id="repo-url">…</span>
    <a class="btn" id="sileo" href="#">Add to Sileo</a>
    <a class="btn secondary" id="zebra" href="#">Zebra</a>
    <a class="btn secondary" id="cydia" href="#">Cydia</a>
    <button class="btn secondary" id="copy" type="button">Copy URL</button>
    <p class="steps">Then install the package that matches your jailbreak: <b>roothide</b> or <b>rootless</b>.</p>
  </div>

  <div id="packages">Loading…</div>

  <footer id="footer"></footer>

</main>

<script>
(function () {
  // The source URL is wherever this page is served from: nothing hard-coded, so
  // renaming the repo or moving it to a custom domain needs no edit here.
  var base = location.origin + location.pathname.replace(/index\.html$/, '');

  document.getElementById('repo-url').textContent = base;
  document.getElementById('sileo').href = 'sileo://source/' + base;
  document.getElementById('zebra').href = 'zbra://sources/add/' + base;
  document.getElementById('cydia').href = 'cydia://url/https://cydia.saurik.com/api/share#?source=' + encodeURIComponent(base);
  document.getElementById('copy').addEventListener('click', function (e) {
    navigator.clipboard.writeText(base).then(function () {
      e.target.textContent = 'Copied';
      setTimeout(function () { e.target.textContent = 'Copy URL'; }, 1600);
    });
  });

  var owner = location.hostname.split('.')[0];
  var project = location.pathname.split('/').filter(Boolean)[0] || '';
  document.getElementById('footer').innerHTML =
    'Free to use. Most tweaks are open source (<a href="https://github.com/' + owner + '/' + project + '">source on GitHub</a>); ' +
    '<a href="https://github.com/' + owner + '/albrhi-whatsapp">Albrhi for WhatsApp</a> is closed source.' +
    '<br>Not affiliated with any of the apps these tweaks modify.';


  // The moving rows. Each card is the tool's wide picture (cards/wide-<name>.jpg, published beside this page) and opens that tool's page.
  // A lane is its cards twice in a row, so the loop (a shift of exactly half) has no seam. A picture that is missing is dropped, never a broken box.
  var GH = 'https://github.com/' + location.hostname.split('.')[0] + '/';
  var CARDS = [['albrhi', 'albrhi-repo'], ['instagram', 'albrhi-repo/blob/main/docs/tweaks/instagram.md'], ['youtube', 'albrhi-repo/blob/main/docs/tweaks/youtube.md'],
               ['tiktok', 'albrhi-repo/blob/main/docs/tweaks/tiktok.md'], ['twitter', 'albrhi-repo/blob/main/docs/tweaks/x.md'], ['whatsapp', 'albrhi-whatsapp'],
               ['ytmusic', 'albrhi-repo/blob/main/docs/tweaks/youtube-music.md'], ['nextup', 'albrhi-repo/blob/main/docs/tweaks/nextup.md'], ['watch', 'albrhi-repo/blob/main/docs/tweaks/watch.md'],
               ['panel', 'albrhi-repo/blob/main/docs/tweaks/panel.md']];
  function fill(id, list) {
    var lane = document.getElementById(id);
    [0, 1].forEach(function (copy) {
      list.forEach(function (c) {
        var a = document.createElement('a'); a.href = GH + c[1]; a.target = '_blank'; a.rel = 'noopener';
        if (copy) a.setAttribute('aria-hidden', 'true'), a.tabIndex = -1;
        var img = new Image(); img.alt = copy ? '' : c[0]; img.loading = 'lazy'; img.src = base + 'cards/wide-' + c[0] + '.jpg';
        img.onerror = function () { a.parentNode && a.parentNode.removeChild(a); };
        a.appendChild(img); lane.appendChild(a);
      });
    });
  }
  fill('lane1', CARDS.slice(0, 5)); fill('lane2', CARDS.slice(5));

  // The order of the groups and one line about each. A section the page has never heard of (a foreign package) still shows, after these.
  var ORDER = ['Albrhi', 'WhatsApp', 'Media', 'System', 'Single apps'];
  var NOTES = {
    'Albrhi': 'The social apps in one install, each switched on per app from Settings.',
    'WhatsApp': 'Privacy for WhatsApp, in your hands.',
    'Media': 'Lock Screen and Control Centre.',
    'System': 'Pairing and system settings.',
    'Single apps': 'The same tweaks that are inside Albrhi, one per app. Install either the single app or Albrhi, not both.'
  };

  // A Debian Packages file into stanzas. Reading the real index means the page never needs editing.
  function parsePackages(text) {
    return text.split(/\n\n+/).filter(function (b) { return b.trim(); }).map(function (block) {
      var fields = {}, current = null;
      block.split('\n').forEach(function (line) {
        if (/^[ \t]/.test(line)) {
          if (current) fields[current] += line.trim() === '.' ? '\n' : ' ' + line.trim();
          return;
        }
        var at = line.indexOf(':');
        if (at < 0) return;
        current = line.slice(0, at);
        fields[current] = line.slice(at + 1).trim();
      });
      return fields;
    }).filter(function (f) { return f.Package; });
  }

  // Numeric runs compare as numbers, so 3.2.10 sorts above 3.2.9.
  function compareVersions(a, b) {
    var l = String(a || '').split(/[^0-9a-zA-Z]+/), r = String(b || '').split(/[^0-9a-zA-Z]+/);
    for (var i = 0; i < Math.max(l.length, r.length); i++) {
      var x = l[i] || '', y = r[i] || '';
      if (x === y) continue;
      if (/^\d+$/.test(x) && /^\d+$/.test(y)) return parseInt(x, 10) - parseInt(y, 10);
      return x < y ? -1 : 1;
    }
    return 0;
  }

  // The index carries older versions for rollback; this page is a shop window, so one card per product: the newest
  // version, with its roothide and rootless builds as chips instead of two near-identical rows.
  function products(pkgs) {
    var byBase = {};
    pkgs.forEach(function (p) {
      var id = p.Package.replace(/\.roothide$/, '');
      var flavour = /arm64e/.test(p.Architecture || '') || /\.roothide$/.test(p.Package) ? 'roothide' : 'rootless';
      var entry = byBase[id] || (byBase[id] = { id: id, flavours: {}, best: null });
      if (!entry.flavours[flavour] || compareVersions(p.Version, entry.flavours[flavour].Version) > 0) entry.flavours[flavour] = p;
      if (!entry.best || compareVersions(p.Version, entry.best.Version) > 0) entry.best = p;
    });
    return Object.keys(byBase).map(function (k) { return byBase[k]; });
  }

  function clean(name) { return name.replace(/\s*\((rootless|roothide|rootful)\)\s*$/, ''); }

  fetch('Packages', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) {
      var list = products(parsePackages(text));
      var groups = {};
      list.forEach(function (pr) {
        var sec = pr.best.Section || 'Tweaks';
        (groups[sec] = groups[sec] || []).push(pr);
      });
      var names = Object.keys(groups).sort(function (a, b) {
        var i = ORDER.indexOf(a), j = ORDER.indexOf(b);
        return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || a.localeCompare(b);
      });
      var host = document.getElementById('packages');
      host.innerHTML = '';
      if (!names.length) { host.textContent = 'No packages yet.'; return; }

      names.forEach(function (sec) {
        var g = document.createElement('section');
        g.className = 'group';
        var h = document.createElement('h3'); h.textContent = sec; g.appendChild(h);
        if (NOTES[sec]) { var n = document.createElement('p'); n.className = 'note'; n.textContent = NOTES[sec]; g.appendChild(n); }
        groups[sec].sort(function (a, b) { return clean(a.best.Name || a.id).localeCompare(clean(b.best.Name || b.id)); }).forEach(function (pr) {
          var p = pr.best;
          var row = document.createElement('div'); row.className = 'pkg';
          // No icon, or one that will not load: a neutral tile with the initial, never our own mark (a foreign package must not look like ours).
          var img;
          function plain() { var d = document.createElement('div'); d.className = 'plain'; d.textContent = clean(p.Name || p.Package).charAt(0).toUpperCase(); return d; }
          if (p.Icon) {
            img = document.createElement('img'); img.alt = ''; img.src = p.Icon;
            img.onerror = function () { var d = plain(); img.parentNode.replaceChild(d, img); };
          } else { img = plain(); }
          var body = document.createElement('div'); body.className = 'pkg-body';
          var nm = document.createElement('div'); nm.className = 'pkg-name'; nm.textContent = clean(p.Name || p.Package);
          var ds = document.createElement('div'); ds.className = 'pkg-desc'; ds.textContent = (p.Description || '').split('\n')[0].trim();
          var meta = document.createElement('div'); meta.className = 'pkg-meta';
          var v = document.createElement('span'); v.textContent = 'v' + (p.Version || '?'); meta.appendChild(v);
          if (!/^com\.albrhi(\.|$)/.test(pr.id)) { var tp = document.createElement('span'); tp.className = 'chip'; tp.textContent = 'third-party'; meta.appendChild(tp); }
          ['roothide', 'rootless'].forEach(function (f) {
            if (pr.flavours[f]) { var c = document.createElement('span'); c.className = 'chip'; c.textContent = f; meta.appendChild(c); }
          });
          body.appendChild(nm); body.appendChild(ds); body.appendChild(meta);
          row.appendChild(img); row.appendChild(body);
          if (p.Depiction) { var a = document.createElement('a'); a.className = 'more'; a.href = p.Depiction; a.textContent = 'Details'; row.appendChild(a); }
          g.appendChild(row);
        });
        host.appendChild(g);
      });
    })
    .catch(function () { document.getElementById('packages').textContent = 'Could not read the package index.'; });
})();
</script>
</body>
</html>
